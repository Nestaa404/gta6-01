<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmara — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c0f16;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    background: #7fae62;
    /* Keep the 16:9 playfield fitted to the window. */
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    image-rendering: auto;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
